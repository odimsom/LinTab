// Canonical definition lives in shared-protocol/events.proto — keep in sync.

syntax = "proto3";

package lintab;

option java_package = "com.lintab.protocol";
option java_outer_classname = "EventsProto";

message TabletEvent {
  int32    x            = 1;
  int32    y            = 2;
  int32    pressure     = 3;
  int32    tilt_x       = 4;
  int32    tilt_y       = 5;
  ToolType tool         = 6;
  int64    timestamp_us = 7;
  int32    screen_width = 8;
  int32    screen_height= 9;
}

enum ToolType {
  TOOL_FINGER = 0;
  TOOL_PEN    = 1;
  TOOL_ERASER = 2;
}

message EventBatch {
  repeated TabletEvent events = 1;
}
