[package]
name = "lintab-gui"
version = "0.1.0"
edition = "2021"
authors = ["Francisco Daniel Castro Borrome"]
license = "GPL-3.0-or-later"
description = "LinTab GUI – Tauri control panel"

[lib]
name = "lintab_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["net", "io-util"] }
