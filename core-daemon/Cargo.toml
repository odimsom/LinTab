[package]
name = "lintab-core-daemon"
version = "0.3.0"
edition = "2021"
authors = ["Francisco Daniel Castro Borrome"]
license = "GPL-3.0-or-later"
description = "LinTab core daemon – virtual uinput tablet driver for Linux"

[[bin]]
name = "lintab"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes        = "1"
clap         = { version = "4.4", features = ["derive"] }
mdns-sd      = "0.11"
serde        = { version = "1",   features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
prost        = "0.12"
evdev        = "0.12"
local-ip-address = "0.6"
gethostname  = "0.4"
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
prost-build = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true

# ── cargo-deb metadata ────────────────────────────────────────────────────────
[package.metadata.deb]
name            = "lintab"
maintainer      = "Francisco Daniel Castro Borrome <borrome941@gmail.com>"
copyright       = "2026 Francisco Daniel Castro Borrome"
license-file    = ["../docs/INSTALL-USB.md", "0"]
section         = "utils"
priority        = "optional"
extended-description = """\
LinTab transforms any Android device into an ultra-low-latency graphics tablet
for Linux using the kernel uinput subsystem. Supports stylus pressure, tilt,
relative and absolute modes, and hardware-adaptive compensation pipeline."""
depends         = "libc6 (>= 2.35), udev"
recommends      = "adb"
assets = [
    ["target/release/lintab",                            "usr/bin/lintab",                              "755"],
    ["../packaging/udev/99-lintab.rules",                "usr/lib/udev/rules.d/99-lintab.rules",        "644"],
    ["../packaging/systemd/lintab.service",              "usr/lib/systemd/user/lintab.service",         "644"],
    ["../docs/INSTALL-USB.md",                           "usr/share/doc/lintab/INSTALL-USB.md",         "644"],
    ["../docs/INSTALL-WIFI.md",                          "usr/share/doc/lintab/INSTALL-WIFI.md",        "644"],
    ["../docs/INSTALL-OLD-TABLET.md",                   "usr/share/doc/lintab/INSTALL-OLD-TABLET.md",  "644"],
]

# ── cargo-generate-rpm metadata ───────────────────────────────────────────────
[package.metadata.generate-rpm]
name        = "lintab"
summary     = "Android-to-Linux virtual uinput tablet daemon"
license     = "GPL-3.0-or-later"
url         = "https://github.com/odimsom/LinTab"
group       = "System/Hardware"
requires    = { systemd = "*" }

[[package.metadata.generate-rpm.assets]]
source      = "target/release/lintab"
dest        = "/usr/bin/lintab"
mode        = "0755"

[[package.metadata.generate-rpm.assets]]
source      = "../packaging/udev/99-lintab.rules"
dest        = "/usr/lib/udev/rules.d/99-lintab.rules"
mode        = "0644"

[[package.metadata.generate-rpm.assets]]
source      = "../packaging/systemd/lintab.service"
dest        = "/usr/lib/systemd/user/lintab.service"
mode        = "0644"
